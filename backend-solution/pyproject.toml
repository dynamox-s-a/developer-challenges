[project]
name = "backend-solution"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "numpy>=2.4.2",
    "pydantic-settings>=2.13.1",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.48",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "taskipy>=1.14.1,<2.0.0",
    "ruff>=0.15.4,<0.16.0",
    "typos>=1.44.0,<2.0.0",
    "pyright>=1.1.408",
    "pytest-benchmark>=5.2.3",
]

loadtest = [
    "locust>=2.43.3",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
markers = [
    "benchmark: marks tests as benchmark tests",
    "load: marks tests as load tests",
]
addopts = "-p no:warnings -m 'not load'"

[tool.taskipy.tasks]
pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
app = 'fastapi dev app/main.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=app -vv'
post_test = 'coverage html'

[tool.typos]
files.extend-exclude = ["README.md"]
