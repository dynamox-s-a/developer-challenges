version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres_dynamox_challenge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: api_dynamox_challenge
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3000:3000'
    volumes:
      - .:/workspaces/dynamox-challenge
    working_dir: /workspaces/dynamox-challenge
    command: tail -f /dev/null

  web:
    image: node:20-alpine
    container_name: web_dynamox_challenge
    depends_on:
      - api
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - '5173:5173'
    volumes:
      - .:/workspaces/dynamox-challenge
    working_dir: /workspaces/dynamox-challenge
    command: sh -c "cd apps/web && npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
