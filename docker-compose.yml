version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dynamox-db
    environment:
      POSTGRES_USER: dynamox
      POSTGRES_PASSWORD: dynamox123
      POSTGRES_DB: dynamox
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamox -d dynamox"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
