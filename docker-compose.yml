services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: dynamox_timescaledb
    environment:
      - POSTGRES_USER=dynamox_user
      - POSTGRES_PASSWORD=dynamox_password
      - POSTGRES_DB=timeseries_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  api:
    build: .
    container_name: dynamox_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dynamox_user:dynamox_password@timescaledb:5432/timeseries_db
    depends_on:
      - timescaledb

volumes:
  timescaledb_data: