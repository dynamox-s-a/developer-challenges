services:
  mongo:
    image: mongo:7
    container_name: time-series-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: time-series-api
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: time-series-api
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/time-series-api
    restart: on-failure

volumes:
  mongo_data: