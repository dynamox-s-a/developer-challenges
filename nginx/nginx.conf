worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time ms "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # ── Upstream: round-robin across 3 API workers ────────────────────────────
    upstream timeseries_api {
        least_conn;                     # route to instance with fewest active connections
        server api1:8000 max_fails=3 fail_timeout=30s;
        server api2:8000 max_fails=3 fail_timeout=30s;
        server api3:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Rate limiting ────────────────────────────────────────────────────
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
        limit_req zone=api_limit burst=200 nodelay;

        # ── Proxy headers ────────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Timeouts ─────────────────────────────────────────────────────────
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── Routes ───────────────────────────────────────────────────────────
        location / {
            proxy_pass http://timeseries_api;
        }

        location /health {
            proxy_pass http://timeseries_api/health;
            access_log off;
        }

        # ── Nginx status (internal monitoring) ───────────────────────────────
        location /nginx-status {
            stub_status;
            allow 127.0.0.1;
            deny  all;
        }
    }
}
