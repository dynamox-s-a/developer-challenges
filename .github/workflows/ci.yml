name: KMP CI

on:
  push:
    branches: [ "main", "master", "container" ] # Ajuste para sua branch
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Runner Linux oficial do GitHub

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Roda os testes do common via Unit Tests do Android (JVM)
      - name: Run Common Tests
        run: ./gradlew :composeApp:testDebugUnitTest

      # Compila o APK de Debug
      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug

      # Faz o upload do APK para você baixar direto do GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-app-debug
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk