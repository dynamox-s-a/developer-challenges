name: CD

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy-app:
    name: Deploy application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_APP_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        run: pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build application for Vercel
        run: pnpm exec vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy application to production
        run: |
          deployment_url="$(pnpm exec vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "### Application deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

  deploy-storybook:
    name: Deploy Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_STORYBOOK_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        run: pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Storybook for Vercel
        run: pnpm exec vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Storybook to production
        run: |
          deployment_url="$(pnpm exec vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "### Storybook deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

  production-smoke:
    name: Production smoke tests
    needs: [deploy-app, deploy-storybook]
    if: >-
      needs.deploy-app.result == 'success' &&
      needs.deploy-storybook.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production endpoints
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --output /tmp/data-page.html \
            https://dynamox.leonardojacomussi.com/data
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --output /tmp/measurements.json \
            https://dynamox.leonardojacomussi.com/api/measurements
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --output /tmp/storybook.html \
            https://dynamox-storybook.leonardojacomussi.com
          jq --exit-status 'length == 7 and all(.[]; has("id") and has("name") and has("data"))' \
            /tmp/measurements.json

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Run production Cypress smoke tests
        run: >-
          pnpm exec cypress run
          --config baseUrl=https://dynamox.leonardojacomussi.com
          --spec cypress/e2e/data-page-load.cy.ts,cypress/e2e/synchronized-tooltip.cy.ts

      - name: Upload production smoke failure artifacts
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-failure-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
