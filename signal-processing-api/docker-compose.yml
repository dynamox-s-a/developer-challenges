services:
  db:
    image: postgres:15-alpine
    container_name: signal-processing-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timeseries_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: signal-processing-api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/timeseries_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app:cached
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  db_data:
