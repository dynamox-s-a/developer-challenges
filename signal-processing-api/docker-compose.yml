services:
  db:
    image: postgres:15-alpine
    container_name: signal-processing-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build: .
    container_name: signal-processing-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    command: python -m app.core.db_init

  api1:
    build: .
    container_name: signal-processing-api1
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      INSTANCE_NAME: api1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  api2:
    build: .
    container_name: signal-processing-api2
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      INSTANCE_NAME: api2
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  api3:
    build: .
    container_name: signal-processing-api3
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      INSTANCE_NAME: api3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:latest
    container_name: signal-processing-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api1
      - api2
      - api3

volumes:
  db_data: