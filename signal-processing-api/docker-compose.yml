services:
  db:
    image: postgres:15-alpine
    container_name: signal-processing-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: signal-processing-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.core.db_init && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data: