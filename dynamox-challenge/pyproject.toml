[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise Python syntax)
    "B",   # flake8-bugbear (common bug patterns)
    "C4",  # flake8-comprehensions (cleaner list/dict comprehensions)
    "SIM", # flake8-simplify (simplifiable code patterns)
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long — black handles this
    "B008",   # do not perform function calls in default arguments (FastAPI uses Depends())
    "SIM108", # ternary operator — sometimes explicit if/else is clearer
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # allow assert statements in tests
]
"migrations/**/*.py" = [
    "F401", # allow unused imports (Alembic env.py patterns)
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    migrations/versions
  | \.git
  | \.venv
  | venv
)/
'''
