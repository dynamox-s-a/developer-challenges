# Load balancer in front of scaled API replicas + static web.
# Docker embedded DNS (127.0.0.11) + variable proxy_pass forces re-resolution
# so traffic spreads across `docker compose ... --scale api=N` containers.

resolver 127.0.0.11 ipv6=off valid=5s;

upstream unused {
  # Kept for documentation; routing uses dynamic resolve below.
  server 127.0.0.1:65535;
}

server {
  listen 80;
  server_name _;

  # API (round-robin via Docker DNS across scaled replicas)
  location /api/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location /health {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # SPA
  location / {
    set $web_upstream http://web:80;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
