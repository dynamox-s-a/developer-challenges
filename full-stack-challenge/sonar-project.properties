# SonarCloud analysis for the Dynapredict full-stack challenge.
# The scanner runs with projectBaseDir=full-stack-challenge, so every path
# below is relative to this folder.

sonar.organization=carvalhodanielg
sonar.projectKey=carvalhodanielg_developer-challenges
sonar.projectName=Dynapredict (full-stack challenge)

sonar.sourceEncoding=UTF-8

# Sources: application and library code. Tests are analyzed separately.
sonar.sources=apps/api/src,apps/api/prisma,apps/web/src,packages/shared-types/src
sonar.tests=apps/api/src,apps/web/src,packages/shared-types/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/generated/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/migrations/**

# Coverage: Vitest writes lcov per project under coverage/ (wired in T2.10).
sonar.javascript.lcov.reportPaths=coverage/apps/api/lcov.info,coverage/apps/web/lcov.info
# Bootstrap and data files carry no testable logic.
sonar.coverage.exclusions=**/main.ts,**/main.tsx,apps/api/prisma/**,**/*.d.ts,**/index.ts

sonar.typescript.tsconfigPaths=apps/api/tsconfig.app.json,apps/web/tsconfig.app.json,packages/shared-types/tsconfig.lib.json
