services:
  api:
    build: .
    environment:
      - DATABASE_URL=postgres://dynamox:dynamox@db:5432/dynamox
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dynamox
      POSTGRES_PASSWORD: dynamox
      POSTGRES_DB: dynamox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamox"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: